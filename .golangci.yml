version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - err113
    - errcheck
    - errorlint
    - exptostd
    - fatcontext
    - goconst
    - gocritic
    - gosec
    - loggercheck
    - mirror
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - predeclared
    - promlinter
    - revive
    - sloglint
    - testifylint
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - ifElseChain
        - importShadow
        - unnamedResult
    goconst:
      min-len: 3
      min-occurrences: 4
    gosec:
      excludes:
        # The refresh cookie and the JWT secret must be readable by the service user.
        - G304
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    perfsprint:
      int-conversion: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    sloglint:
      no-mixed-args: true
      # no-raw-keys is left off: in sloglint v0.11 it rejects every *literal*
      # key, including the keys of slog.String/slog.Attr, which is the opposite
      # of what we want. key-naming-case plus context: all give the real checks.
      no-raw-keys: false
      key-naming-case: snake
      static-msg: true
      context: all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)_test\.go
        linters:
          - bodyclose
          - gosec
          - noctx

formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ahmedmohamedut/kumo)
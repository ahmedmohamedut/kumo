# Gestalt-managed pipeline (ADR-033 + ADR-041).
#
# ADR-041 — CI is the primary runtime quality gate. It runs lint,
# tests, and a security scan before the Gestalt LLM gate
# (constraint-agent + review-agent) is dispatched against the same
# branch. The LLM gate focuses exclusively on architectural
# compliance and design-spec adherence; it never re-runs anything
# CI already validated.
#
# Dispatched by the platform on two occasions:
#   1. pipeline-agent triggers it after pr-agent opens (or pushes to)
#      a PR — this is the build/test/lint/security check that gates
#      the gate
#   2. promotion-agent triggers it on each environment promotion
#      (`environment` input set to `staging` then `production`)
#
# Setup steps + commands are stack-specific — generated by the
# `generateStackConfig` LLM call at `gestalt init` time from the
# project description. Customise below for your project's
# build / lint / integration test / deploy commands.

name: gestalt
# TR_020 — one CI run per Aider push for the build/test/lint/scan
# quality job. PR-Agent (ADR-051 / TR_027) runs SERVER-SIDE inside
# the Gestalt container via `executeScript` after CI passes —
# Gestalt's own LLM credentials drive it, and `.pr_agent.toml`
# committed to the project repo carries the project-specific
# review focus. No CI step or repo secret required.
#   - `push`             triggers `quality` (build / test / lint /
#                        security) on every Gestalt branch commit.
#   - `workflow_dispatch` retained ONLY for promotion-agent's
#                        staging / production deploy invocation
#                        (different `inputs.environment` value).
on:
  push:
    # Every branch prefix the platform creates: feature/phase/retry/fix (per-run,
    # gestalt_core.git.branches) + gestalt/** (legacy + maintenance branches).
    branches: ['gestalt/**', 'feature/**', 'phase/**', 'retry/**', 'fix/**']
    # Gestalt writes its own bookkeeping artifacts (planning specs, per-agent
    # .gestalt/** outputs incl. openhands sessions, PLAN.md, all docs/** the
    # context-agent maintains, AGENTS.md) as commits on these branches. A commit
    # touching ONLY these needs no CI. GitHub runs the job only when the push
    # matches a branch pattern AND at least one changed file is NOT ignored, so
    # any commit that also touches src/tests/config still triggers CI. This is
    # Gestalt's FIXED platform-owned output set — identical for every project.
    paths-ignore:
      - '.gestalt/**'
      - 'PLAN.md'
      - 'docs/**'
      - 'AGENTS.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging | production). Other values are accepted on CI-only dispatches.'
        required: false
        default: 'staging'
        type: string
      correlationId:
        description: 'Gestalt correlation id for this intent cycle.'
        required: false
        type: string
      branch:
        description: 'Source branch for the dispatched run.'
        required: false
        type: string

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same toolchain setup as ci.yml: go.mod is the single source of the Go version, and
      # the console is built with the Node line ci.yml pins.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: make deps

      # ── Every check is NON-BLOCKING (continue-on-error) — the Gestalt CI-agent is the SOLE gate.
      # No individual check's exit code decides "does this phase proceed"; each check RUNS and
      # REPORTS its outcome (captured below into ci-results.json), and the CI-agent judges the
      # collected outcomes + logs by DevOps severity (blocking-defect / blocking-security /
      # non-blocking-hygiene / infra-noise / flaky-inconclusive). A real compile/test/security
      # failure still blocks (via the CI-agent). Each check carries an `id:` so its `.outcome`
      # is recorded even when it fails. The commands are Kumo's own Makefile targets, so green
      # here means what green means on a developer's machine (see ci.yml).
      - name: Compile
        id: compile
        continue-on-error: true
        # AGENTS.md architecture rule 7: Kumo builds with CGO_ENABLED=0. `./...` compiles every
        # package, including tests' dependencies, without running anything.
        run: CGO_ENABLED=0 go build ./... && CGO_ENABLED=0 go vet ./...

      - name: Test
        id: test
        continue-on-error: true
        # `make test` stages the console first (internal/webui asserts one is embedded), then
        # runs `go test ./... -race -count=1` and the web tests.
        run: make test

      - name: Lint
        id: lint
        continue-on-error: true
        # golangci-lint, oxlint, prettier --check and tsc --noEmit.
        run: make lint

      - name: Security scan
        id: semgrep
        continue-on-error: true
        # Run Semgrep directly via pip (the dedicated action is deprecated/archived). NO `--error`
        # and NO `--exclude` — the CI-agent is the sole gate now, so semgrep just REPORTS (JSON to
        # an artifact) and the agent classifies each finding (a real vuln on app code → blocking;
        # a mutable-action-tag on the workflow file → infra-noise → surfaced, not blocking).
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config auto --disable-version-check --json --output semgrep.json || true

      # ── Collect every check's outcome so the CI-agent sees failures even though the job 'passes'
      # (each check is continue-on-error, so a failed compile/test does NOT fail the job). `always()`
      # ensures this runs regardless of upstream outcomes; `.outcome` is the check's REAL result.
      - name: Collect CI check results (for the Gestalt CI-agent)
        if: always()
        run: |
          cat > ci-results.json <<JSON
          { "checks": [
            { "name": "compile", "outcome": "${{ steps.compile.outcome }}" },
            { "name": "test",    "outcome": "${{ steps.test.outcome }}" },
            { "name": "lint",    "outcome": "${{ steps.lint.outcome }}" },
            { "name": "semgrep", "outcome": "${{ steps.semgrep.outcome }}" }
          ] }
          JSON
          echo "CI check outcomes:"; cat ci-results.json

      # Two SEPARATE artifacts (not one bundle): the CI-agent reads each by name — the per-check
      # outcome summary and the semgrep results are parsed differently, so they must not be
      # concatenated into a single artifact zip.
      - name: Upload CI check-outcome summary for the CI-agent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: ci-results.json
          if-no-files-found: ignore

      - name: Upload semgrep results for the CI-agent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep.json
          if-no-files-found: ignore

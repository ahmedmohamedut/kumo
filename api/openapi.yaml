openapi: 3.0.3
info:
  title: Kumo API
  description: |
    AWS-like private cloud API for KVM/libvirt, served by kumod at `/api/v1`.

    This file is derived from `docs/design/01-api.md`; a test asserts that every
    endpoint documented there is described here.
  version: 0.1.0
servers:
  - url: /api/v1
    description: The control plane, same origin as the web console.
tags:
  - name: Auth
    description: First-run setup, login, refresh and session introspection.
  - name: System
    description: Build information and host capacity.
  - name: InstanceTypes
    description: Instance sizes; readable by both roles, managed by administrators.
  - name: KeyPairs
    description: SSH key pairs; generated private keys are returned exactly once.
  - name: Images
    description: Machine images imported from a URL or the curated catalog.
  - name: Instances
    description: Virtual machines; state changes run as tasks.
  - name: Tasks
    description: Asynchronous operation progress.
  - name: AccessKeys
    description: >-
      S3 credentials for applications, each limited to chosen buckets; the
      secret is returned once. 503 when object storage is off.
  - name: Buckets
    description: >-
      Object storage buckets on the RustFS server Kumo manages
      (06-object-storage.md). Every route answers 503 when the module is off.
  - name: DBInstances
    description: >-
      Managed Postgres servers (07-databases.md). The virtual machine behind
      each one belongs to Kumo and is not on the Instances pages. Every route
      answers 503 when the module is off.
security:
  - bearerAuth: []
paths:
  /auth/setup:
    post:
      tags: [Auth]
      operationId: authSetup
      summary: Create the first administrator
      description: Only allowed while the instance has no users; otherwise 409.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSetupRequest'
      responses:
        '201':
          description: The first administrator was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Exchange credentials for an access token
      description: |
        Returns an access token valid for 15 minutes and sets the refresh
        cookie (`HttpOnly; Secure; SameSite=Strict`). Failures are rate limited
        to 5/minute per IP and username and are indistinguishable, so login
        cannot be used to enumerate users.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login succeeded.
          headers:
            Set-Cookie:
              description: The rotated refresh token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Rotate the refresh token
      description: |
        Reads the refresh cookie, revokes the presented token and issues a new
        one. Presenting an already revoked token revokes the whole family.
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '200':
          description: A new access token was issued.
          headers:
            Set-Cookie:
              description: The rotated refresh token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Revoke the refresh token
      security: []
      responses:
        '204':
          description: Logged out and the cookie was cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      summary: The authenticated user
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /system/info:
    get:
      tags: [System]
      operationId: systemInfo
      summary: Build information and hypervisor status
      security: []
      responses:
        '200':
          description: The state of the control plane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /system/capacity:
    get:
      tags: [System]
      operationId: systemCapacity
      summary: Host capacity versus allocation
      responses:
        '200':
          description: Totals and the part of them that is in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCapacity'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /system/orphans:
    get:
      tags: [System]
      operationId: systemOrphans
      summary: Domains the reconciler cannot account for
      description: |
        Domains libvirt runs under an instance id that no instance row claims,
        from the most recent reconcile pass (`00-architecture.md` section 4.3).
        Kumo reports them and never removes them: a guest an operator is relying
        on is indistinguishable from a leftover, so the clean-up is a decision
        for a person.

        The list is served from the last pass rather than probed per request, so
        an empty list is also what a node that has not completed a pass answers.
        Administrators only: an orphan describes the host rather than anything
        Kumo manages.
      responses:
        '200':
          description: The domains of the last pass that had no row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrphanList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /instance-types:
    get:
      tags: [InstanceTypes]
      operationId: listInstanceTypes
      summary: List the instance types
      description: Smallest first (memory, then vCPUs, then id). The seed set is documented in `01-api.md`.
      responses:
        '200':
          description: The available types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceTypeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [InstanceTypes]
      operationId: createInstanceType
      summary: Create an instance type
      description: |
        An empty `description` is generated from the size (`"4 vCPU, 8 GiB"`).
        A taken `id` is `409 already_exists`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceTypeRequest'
      responses:
        '201':
          description: The type was created.
          headers:
            Location:
              description: The new type.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceType'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
  /instance-types/{id}:
    parameters:
      - $ref: '#/components/parameters/InstanceTypeID'
    get:
      tags: [InstanceTypes]
      operationId: getInstanceType
      summary: Instance type detail
      responses:
        '200':
          description: The type with the instances that reference it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceTypeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [InstanceTypes]
      operationId: updateInstanceType
      summary: Update an instance type
      description: |
        Existing instances keep the size they launched at; the change applies
        to later launches. The `id` is immutable. A description that was
        generated from the old size follows the new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstanceTypeRequest'
      responses:
        '200':
          description: The updated type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceType'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [InstanceTypes]
      operationId: deleteInstanceType
      summary: Delete an instance type
      description: '`409` while any instance references the type, terminated ones included.'
      responses:
        '204':
          description: The type was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /key-pairs:
    get:
      tags: [KeyPairs]
      operationId: listKeyPairs
      summary: List key pairs
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: A page of key pairs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyPairList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [KeyPairs]
      operationId: createKeyPair
      summary: Generate a key pair
      description: |
        The server generates an `ed25519` or `rsa-4096` key. `private_key` is
        present in this response only and is never stored or logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyPairRequest'
      responses:
        '201':
          description: The key pair was created; save `private_key` now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateKeyPairResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
  /key-pairs/import:
    post:
      tags: [KeyPairs]
      operationId: importKeyPair
      summary: Import an existing public key
      description: |
        `public_key` is an OpenSSH `authorized_keys` line, validated with
        `ssh.ParseAuthorizedKey`. RSA keys below 2048 bits are rejected, as is
        private key material pasted into the field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportKeyPairRequest'
      responses:
        '201':
          description: The key pair was imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyPair'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
  /key-pairs/{id}:
    parameters:
      - $ref: '#/components/parameters/KeyPairID'
    get:
      tags: [KeyPairs]
      operationId: getKeyPair
      summary: Key pair detail
      responses:
        '200':
          description: The key pair, including the instances that use it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyPairDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [KeyPairs]
      operationId: updateKeyPair
      summary: Update the tags of a key pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagsRequest'
      responses:
        '200':
          description: The updated key pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyPair'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [KeyPairs]
      operationId: deleteKeyPair
      summary: Delete a key pair
      description: |
        `409` while a non-terminated instance uses the key, unless
        `force=true`. As in AWS, deleting a key does not touch the keys already
        injected into running instances.
      parameters:
        - $ref: '#/components/parameters/Force'
      responses:
        '204':
          description: The key pair was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /images:
    get:
      tags: [Images]
      operationId: listImages
      summary: List images
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
        - name: state
          in: query
          description: Restrict the page to one image state.
          schema:
            $ref: '#/components/schemas/ImageState'
      responses:
        '200':
          description: A page of images.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /images/catalog:
    get:
      tags: [Images]
      operationId: listCatalogImages
      summary: Curated cloud images
      description: |
        Ubuntu, Debian, Rocky, Alma, Fedora and Alpine with their download and
        checksum URLs, to power the quick import picker. The catalog is static
        configuration, not user data.
      responses:
        '200':
          description: The catalog entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogImage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /images/import:
    post:
      tags: [Images]
      operationId: importImage
      summary: Import an image from a URL
      description: |
        The download runs as a task; the response is `202` with the image in
        `pending`. Only `http(s)` URLs outside link-local and metadata ranges are
        allowed, and the size limit and checksum are enforced while downloading.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportImageRequest'
      responses:
        '202':
          description: The import was accepted.
          headers:
            Location:
              description: The task that tracks the import.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /images/{id}:
    parameters:
      - $ref: '#/components/parameters/ImageID'
    get:
      tags: [Images]
      operationId: getImage
      summary: Image detail
      responses:
        '200':
          description: The image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Images]
      operationId: updateImage
      summary: Rename or re-tag an image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateImageRequest'
      responses:
        '200':
          description: The updated image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Images]
      operationId: deleteImage
      summary: Delete an image
      description: |
        `409` while any instance references the image, terminated ones
        included, with the blocking instance ids in the message.
      responses:
        '202':
          description: The deletion was accepted.
          headers:
            Location:
              description: The task that tracks the deletion.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /images/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/ImageID'
    post:
      tags: [Images]
      operationId: retryImageTask
      summary: Retry a failed image import or deletion
      description: |
        Re-queues the task that failed last, with the same payload, and returns
        `202`. Only an image in `failed` can be retried, so a fresh task is
        never queued over one that is still running. Use the `source_url`
        already stored on the image: a download that failed to reach its host
        usually fails again.
      responses:
        '202':
          description: The retry was accepted.
          headers:
            Location:
              description: The task that tracks the retry.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /instances:
    get:
      tags: [Instances]
      operationId: listInstances
      summary: List instances
      description: >-
        The servers behind DB instances are not returned: they belong to the
        databases module rather than the Instances pages, while still counting
        against `/system/capacity` (07-databases.md R7). Their lifecycle
        endpoints answer `409` for the same reason.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
        - name: state
          in: query
          description: Restrict the page to one instance state.
          schema:
            $ref: '#/components/schemas/InstanceState'
      responses:
        '200':
          description: A page of instances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Instances]
      operationId: launchInstance
      summary: Launch instances
      description: |
        Runs as a task and answers `202` with the instance in `pending`.
        Validation: `name` is an RFC 1123 label of 1-63 characters,
        `root_disk_gb` is at least the image's `min_disk_gb` and at most 2048,
        `user_data` is at most 16 KiB, `count` must be 1, the image must be
        `available`, and the host must have capacity left.

        A `count` above 1 is refused in this release rather than given a
        numbering convention the contract does not define; the field stays so a
        client can send it unchanged when it becomes available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchInstanceRequest'
      responses:
        '202':
          description: The launch was accepted.
          headers:
            Location:
              description: The task that tracks the launch.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /instances/{id}:
    parameters:
      - $ref: '#/components/parameters/InstanceID'
    get:
      tags: [Instances]
      operationId: getInstance
      summary: Instance detail
      description: "`user_data` is only included for administrators."
      responses:
        '200':
          description: The instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Instances]
      operationId: updateInstance
      summary: Rename or re-tag an instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstanceRequest'
      responses:
        '200':
          description: The updated instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Instances]
      operationId: terminateInstance
      summary: Terminate an instance
      description: |
        Removes the instance as a task, answering `202`: the domain, its storage
        and its NVRAM file go, then the row itself, so `GET /instances/{id}`
        answers `404` once the task has run. Repeating the call after that is a
        `404` like any other unknown id. `terminated` is still a state the call
        is accepted from, for the rows an earlier release kept as history —
        the task purges those.
      responses:
        '202':
          description: The termination was accepted.
          headers:
            Location:
              description: The task that tracks the termination.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /instances/{id}/start:
    parameters:
      - $ref: '#/components/parameters/InstanceID'
    post:
      tags: [Instances]
      operationId: startInstance
      summary: Start a stopped instance
      responses:
        '202':
          description: The start was accepted.
          headers:
            Location:
              description: The task that tracks the start.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /instances/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/InstanceID'
    post:
      tags: [Instances]
      operationId: stopInstance
      summary: Stop an instance
      description: 'ACPI shutdown by default; `force=true` destroys it instead.'
      parameters:
        - $ref: '#/components/parameters/Force'
      responses:
        '202':
          description: The stop was accepted.
          headers:
            Location:
              description: The task that tracks the stop.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /instances/{id}/reboot:
    parameters:
      - $ref: '#/components/parameters/InstanceID'
    post:
      tags: [Instances]
      operationId: rebootInstance
      summary: Reboot an instance
      description: 'ACPI reboot by default; `force=true` resets the domain.'
      parameters:
        - $ref: '#/components/parameters/Force'
      responses:
        '202':
          description: The reboot was accepted.
          headers:
            Location:
              description: The task that tracks the reboot.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /instances/{id}/console-output:
    parameters:
      - $ref: '#/components/parameters/InstanceID'
      - name: tail_kib
        in: query
        description: How much of the serial console log to return.
        schema:
          type: integer
          minimum: 1
          maximum: 1024
          default: 64
    get:
      tags: [Instances]
      operationId: getInstanceConsoleOutput
      summary: Last N KiB of the serial console log
      responses:
        '200':
          description: The tail of the serial log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleOutput'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
  /instances/{id}/console:
    parameters:
      - $ref: '#/components/parameters/InstanceID'
    get:
      tags: [Instances]
      operationId: openInstanceConsole
      summary: WebSocket bridge to the VNC console
      description: |
        Upgrades to a WebSocket that proxies the console of the instance. The
        VNC socket itself is bound to `127.0.0.1` and is only reachable through
        this authenticated proxy. Scheduled for M5.
      responses:
        '101':
          description: The WebSocket upgrade succeeded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /vpcs:
    get:
      tags: [VPCs]
      operationId: listVPCs
      summary: List VPCs
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: A page of VPCs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPCList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [VPCs]
      operationId: createVPC
      summary: Create a VPC
      description: |
        Asynchronous: the response is `202` with the task that defines and
        starts the VPC's libvirt network. The network becomes active after the
        task succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVPCRequest'
      responses:
        '202':
          description: The VPC was recorded; the network task is queued.
          headers:
            Location:
              description: The task that defines and starts the network.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPCWithTask'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
  /vpcs/{id}:
    parameters:
      - $ref: '#/components/parameters/VPCID'
    get:
      tags: [VPCs]
      operationId: getVPC
      summary: VPC detail
      responses:
        '200':
          description: The VPC with the counts of what lives inside it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPCDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [VPCs]
      operationId: updateVPC
      summary: Update the tags of a VPC
      description: '`name`, `cidr` and `mode` are immutable; only tags move.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagsRequest'
      responses:
        '200':
          description: The updated VPC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPC'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [VPCs]
      operationId: deleteVPC
      summary: Delete a VPC
      description: |
        Asynchronous: the `202` response carries the task that destroys and
        undefines the network, then removes the row. Refused with `409` while
        any subnet (or instance) still exists inside it.
      responses:
        '202':
          description: The deletion was queued.
          headers:
            Location:
              description: The task that removes the network and the row.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPCWithTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /subnets:
    get:
      tags: [Subnets]
      operationId: listSubnets
      summary: List subnets
      parameters:
        - name: vpc_id
          in: query
          description: Restrict the page to one VPC.
          schema:
            type: string
            pattern: '^vpc-[0-9a-f]{17}$'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: A page of subnets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Subnets]
      operationId: createSubnet
      summary: Create a subnet
      description: |
        Synchronous: a subnet is a row, so the `201` response is the finished
        resource. The CIDR must sit inside its VPC and not overlap a sibling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubnetRequest'
      responses:
        '201':
          description: The subnet was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subnet'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /subnets/{id}:
    parameters:
      - $ref: '#/components/parameters/SubnetID'
    get:
      tags: [Subnets]
      operationId: getSubnet
      summary: Subnet detail
      responses:
        '200':
          description: The subnet with the counts of its addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subnet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Subnets]
      operationId: updateSubnet
      summary: Update the tags of a subnet
      description: '`name`, `cidr` and `vpc_id` are immutable; only tags move.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagsRequest'
      responses:
        '200':
          description: The updated subnet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subnet'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Subnets]
      operationId: deleteSubnet
      summary: Delete a subnet
      description: |
        Refused with `409` while a network interface is still allocated from
        the subnet; terminate the instances first.
      responses:
        '204':
          description: The subnet was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /rds/db-instances:
    get:
      tags: [DBInstances]
      operationId: listDBInstances
      summary: List DB instances
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Query'
        - name: state
          in: query
          description: Restrict the page to one DB instance state.
          schema:
            $ref: '#/components/schemas/DBInstanceState'
      responses:
        '200':
          description: A page of DB instances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBInstanceList'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [DBInstances]
      operationId: createDBInstance
      summary: Create a DB instance
      description: |
        Runs as a task and answers `202` with the DB instance `creating`.

        `admin_password` is the only field Kumo does not keep: a
        SCRAM-SHA-256 verifier is derived from it, the password is discarded
        before the response, and neither it nor the verifier is ever stored,
        logged or put in a task payload (07-databases.md R8). There is
        therefore **no password reset** in this version.

        Validation: `identifier` is a DNS label of 1-60 characters that must
        not collide with a live instance name, `admin_username` and
        `database_name` are unquoted Postgres identifiers of 1-63 characters
        and may not be reserved (`postgres`, `pg_*`, `template0`,
        `template1`, `rdsadmin`, `kumo`), `storage_gb` is 5-2048 and at least
        the engine image's `min_disk_gb`, and `admin_password` is 10-128
        **printable ASCII** characters. The ASCII rule is a correctness rule:
        SCRAM applies SASLprep before deriving and Kumo does not, so anything
        else would authenticate nowhere.

        `engine_version` may be omitted, which takes the newest available
        version; `subnet_id` may be omitted, which attaches the server to the
        default subnet. `port` is not accepted in this version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDBInstanceRequest'
      responses:
        '202':
          description: The create was accepted.
          headers:
            Location:
              description: The task that tracks the create.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBInstance'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          description: >-
            The identifier is taken, or no engine image is available on this
            node. The latter carries the code `no_engine_image`, which is the
            one code outside the standard set: it means the module is on and
            an operator still has to import an engine image, rather than that
            anything failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /rds/db-instances/{id}:
    parameters:
      - $ref: '#/components/parameters/DBInstanceID'
    get:
      tags: [DBInstances]
      operationId: getDBInstance
      summary: DB instance detail
      description: >-
        Carries the endpoint, the port, the admin username and the database
        name, which is what a client needs to connect, and `instance_id`, which
        is what an operator needs to read the server's console log. It never
        carries the password, the verifier or the salt.
      responses:
        '200':
          description: The DB instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [DBInstances]
      operationId: deleteDBInstance
      summary: Delete a DB instance
      description: >-
        Runs as a task and answers `202` with the DB instance `deleting`. It is
        allowed from every state but `deleting`, because it is also the way out
        of one that is stuck. **The data is gone**: the data disk is deleted
        with the server, and there is no final snapshot and no recovery.
      responses:
        '202':
          description: The delete was accepted.
          headers:
            Location:
              description: The task that tracks the delete.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /rds/db-instances/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/DBInstanceID'
    post:
      tags: [DBInstances]
      operationId: stopDBInstance
      summary: Stop a DB instance
      description: >-
        An ACPI shutdown of the server, never a destroy, so Postgres gets its
        shutdown checkpoint. `409` unless the DB instance is `available`. The
        endpoint and the data disk survive a stop.
      responses:
        '202':
          $ref: '#/components/responses/DBInstanceAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /rds/db-instances/{id}/start:
    parameters:
      - $ref: '#/components/parameters/DBInstanceID'
    post:
      tags: [DBInstances]
      operationId: startDBInstance
      summary: Start a stopped DB instance
      description: >-
        `409` unless the DB instance is `stopped`. The address and the MAC are
        stable across a stop, so the endpoint does not move; the readiness
        probe is what publishes the DB instance as `available` again.
      responses:
        '202':
          $ref: '#/components/responses/DBInstanceAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /rds/db-instances/{id}/reboot:
    parameters:
      - $ref: '#/components/parameters/DBInstanceID'
    post:
      tags: [DBInstances]
      operationId: rebootDBInstance
      summary: Reboot a DB instance
      description: '`409` unless the DB instance is `available`.'
      responses:
        '202':
          $ref: '#/components/responses/DBInstanceAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: Recent tasks
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Sort'
        - name: resource_id
          in: query
          description: Restrict the page to the tasks of one resource.
          schema:
            type: string
      responses:
        '200':
          description: A page of tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskID'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Task detail
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /s3/buckets:
    get:
      tags: [Buckets]
      operationId: listBuckets
      summary: List buckets
      description: |
        Every bucket on the object storage server, by name, including buckets
        made with another client. Not paged: the server returns them at once.
      responses:
        '200':
          description: The buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Buckets]
      operationId: createBucket
      summary: Create a bucket
      description: |
        Creates the bucket, enables versioning when asked, and sets the
        console's CORS rule. A failure after the bucket exists removes it
        again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBucketRequest'
      responses:
        '201':
          description: The new bucket.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketDetail'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /s3/buckets/{name}:
    parameters:
      - $ref: '#/components/parameters/BucketName'
    get:
      tags: [Buckets]
      operationId: getBucket
      summary: Bucket detail
      responses:
        '200':
          description: The bucket with its versioning state and connection details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [Buckets]
      operationId: updateBucket
      summary: Change versioning or tags
      description: |
        The name is immutable. `versioning: false` suspends versioning on a
        bucket that had it and leaves a never-versioned bucket alone. An absent
        `tags` keeps the tags; `{}` drops them. `409` while the bucket is being
        deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBucketRequest'
      responses:
        '200':
          description: The updated bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketDetail'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Buckets]
      operationId: deleteBucket
      summary: Delete a bucket
      description: |
        Without `force`, deletes an empty bucket (`204`) and refuses one that
        holds objects, old versions or delete markers (`409`). With
        `force=true`, marks the bucket `deleting` and answers `202` with a
        `bucket.delete` task that empties it and then deletes it.
      parameters:
        - $ref: '#/components/parameters/Force'
      responses:
        '202':
          description: The deletion task was queued.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketDeleted'
        '204':
          description: The empty bucket was deleted.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /s3/buckets/{name}/objects:
    parameters:
      - $ref: '#/components/parameters/BucketName'
    get:
      tags: [Buckets]
      operationId: listObjects
      summary: List one folder of a bucket
      description: |
        The folders directly below `prefix` (common prefixes on `/`) and the
        objects in it. The zero-byte marker of the folder being listed is not
        an object. Paged with `cursor` and `next_cursor`.
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: One page of the folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectListing'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /s3/buckets/{name}/uploads:
    parameters:
      - $ref: '#/components/parameters/BucketName'
    post:
      tags: [Buckets]
      operationId: presignUpload
      summary: Get a URL to upload one object
      description: |
        A presigned `PUT` the browser sends the file to directly. The
        `Content-Type` is signed into it and must be sent as given in
        `headers`. Applies the console's CORS rule to the bucket first if
        needed. `409` while the bucket is being deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
      responses:
        '200':
          description: The upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedURL'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /s3/buckets/{name}/downloads:
    parameters:
      - $ref: '#/components/parameters/BucketName'
    post:
      tags: [Buckets]
      operationId: presignDownload
      summary: Get a URL to download one object
      description: |
        A presigned `GET` that saves the object under its base name. Open to
        both roles, since it is a read. `404` for a key that does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignDownloadRequest'
      responses:
        '200':
          description: The download URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedURL'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /s3/buckets/{name}/folders:
    parameters:
      - $ref: '#/components/parameters/BucketName'
    post:
      tags: [Buckets]
      operationId: createFolder
      summary: Create a folder
      description: Writes the zero-byte `prefix/` marker S3 consoles use for an empty folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: The folder, with its trailing slash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFolderRequest'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /s3/buckets/{name}/objects/delete:
    parameters:
      - $ref: '#/components/parameters/BucketName'
    post:
      tags: [Buckets]
      operationId: deleteObjects
      summary: Delete objects
      description: |
        Removes up to 1000 keys; a missing key is not an error. A folder key
        (`photos/`) removes only its marker, never the objects below it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteObjectsRequest'
      responses:
        '204':
          description: The keys are gone.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /s3/access-keys:
    get:
      tags: [AccessKeys]
      operationId: listAccessKeys
      summary: List access keys
      description: Every key Kumo issued, by name. No answer but the create carries a secret.
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [AccessKeys]
      operationId: createAccessKey
      summary: Issue an access key
      description: |
        Generates the key id and secret, creates the RustFS user and its
        policy, and returns the secret **once**, with `Cache-Control:
        no-store`. Kumo never stores or logs it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessKeyRequest'
      responses:
        '201':
          description: The key and, this once, its secret.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccessKey'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /s3/access-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The access key id (KUMO + 16 base32 characters).
        schema:
          type: string
    get:
      tags: [AccessKeys]
      operationId: getAccessKey
      summary: Access key detail
      responses:
        '200':
          description: The key, without its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags: [AccessKeys]
      operationId: updateAccessKey
      summary: Rename or re-scope an access key
      description: |
        A change of `level` or `buckets` rewrites the key's policy, effective
        on its next request. The secret cannot be changed: delete a leaked key
        and issue a new one. `409` for a key gone from the object store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccessKeyRequest'
      responses:
        '200':
          description: The updated key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKey'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [AccessKeys]
      operationId: deleteAccessKey
      summary: Revoke an access key
      responses:
        '204':
          description: The key no longer works.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token from `/auth/login`. Sent as `Authorization: Bearer <token>`;
        it expires after 15 minutes and is never stored in the browser.
  parameters:
    PageSize:
      name: page_size
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageToken:
      name: page_token
      in: query
      description: Continuation token from a previous page; absent on the first page.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: Sort order as `field:direction`, e.g. `created_at:desc`.
      schema:
        type: string
        pattern: '^[a-z_]+:(asc|desc)$'
        default: created_at:desc
    Query:
      name: q
      in: query
      description: Case-insensitive substring of the resource name.
      schema:
        type: string
        maxLength: 128
    Force:
      name: force
      in: query
      description: Take the destructive shortcut instead of the graceful path.
      schema:
        type: boolean
        default: false
    BucketName:
      name: name
      in: path
      description: Bucket name.
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 63
    RefreshCookie:
      name: refresh_token
      in: cookie
      description: The `HttpOnly; Secure; SameSite=Strict` refresh cookie.
      required: true
      schema:
        type: string
    InstanceTypeID:
      name: id
      in: path
      description: Instance type id.
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    KeyPairID:
      name: id
      in: path
      description: Key pair id.
      required: true
      schema:
        type: string
        pattern: '^key-[0-9a-f]{17}$'
    ImageID:
      name: id
      in: path
      description: Image id.
      required: true
      schema:
        type: string
        pattern: '^img-[0-9a-f]{17}$'
    InstanceID:
      name: id
      in: path
      description: Instance id.
      required: true
      schema:
        type: string
        pattern: '^i-[0-9a-f]{17}$'
    DBInstanceID:
      name: id
      in: path
      description: DB instance id.
      required: true
      schema:
        type: string
        pattern: '^db-[0-9a-f]{17}$'
    TaskID:
      name: id
      in: path
      description: Task id.
      required: true
      schema:
        type: string
        pattern: '^task-[0-9a-f]{17}$'
    VPCID:
      name: id
      in: path
      description: VPC id.
      required: true
      schema:
        type: string
        pattern: '^vpc-[0-9a-f]{17}$'
    SubnetID:
      name: id
      in: path
      description: Subnet id.
      required: true
      schema:
        type: string
        pattern: '^subnet-[0-9a-f]{17}$'
  responses:
    InvalidArgument:
      description: The request was malformed or a field failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No valid access token was presented.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PermissionDenied:
      description: The role may not perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request contradicts the current state of the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: The request was well-formed but cannot be carried out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: The caller exceeded a rate limit or a quota.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: A dependency cannot serve the request, or the module is off on this node.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DBInstanceAccepted:
      description: The action was accepted and runs as a task on the server.
      headers:
        Location:
          description: The task that tracks the action.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DBInstance'
    NotImplemented:
      description: The endpoint is documented but not implemented yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: An unexpected failure; details are logged, never returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      description: The envelope of every non-2xx response.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable summary, safe to show in the console.
            details:
              type: array
              description: Field level problems; rendered as inline form errors.
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              description: Matches the `X-Request-Id` response header.
    ErrorCode:
      type: string
      description: Stable machine-readable error code.
      enum:
        - invalid_argument
        - unauthenticated
        - permission_denied
        - not_found
        - already_exists
        - conflict
        - quota_exceeded
        - internal
        - unavailable
        - no_engine_image
    ErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    AuthSetupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 10
          description: Hashed with argon2id; never logged.
    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AuthUser:
      type: object
      required: [id, username, role, created_at]
      properties:
        id:
          type: string
          description: UUIDv7.
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          type: string
          format: date-time
    UserRole:
      type: string
      description: '`viewer` may read, but never mutate (403 on writes).'
      enum: [admin, viewer]
    AuthLoginResponse:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: Bearer token, valid for 15 minutes. Kept in memory only.
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthRefreshResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
    SystemInfo:
      type: object
      required: [version, needs_setup, hypervisor, object_storage, databases]
      properties:
        version:
          type: string
          description: Build version of kumod.
        needs_setup:
          type: boolean
          description: True while no user exists and `/auth/setup` is open.
        hypervisor:
          type: object
          required: [type, ok]
          properties:
            type:
              type: string
              enum: [fake, libvirt]
            ok:
              type: boolean
            kvm:
              type: boolean
              description: |
                Whether libvirt can run `kvm` domains, from its capabilities
                (not a stat of `/dev/kvm`, which the packaged service's sandbox
                hides). False means the control plane runs but no instance can
                boot; launches fail as `unavailable`. Null when the backend
                cannot be asked.
              nullable: true
        object_storage:
          type: object
          description: >-
            The optional object storage module (06-object-storage.md). `none`
            means it is off and the console hides the Storage pages; `ok` is
            whether the server answered Kumo's credentials. The endpoint is not
            here because this payload needs no token.
          required: [backend, ok]
          properties:
            backend:
              type: string
              enum: [none, rustfs, fake]
            ok:
              type: boolean
        databases:
          type: object
          description: >-
            The managed Postgres module (07-databases.md section 2). It needs
            no server Kumo does not ship, so it is on unless `KUMO_DATABASES`
            turns it off. `engines` is what a DB instance can actually be
            created from; it is empty until an engine image is imported, which
            is a state the console explains rather than a fault. Image ids are
            not here, for the same reason the object store's endpoint is not:
            this payload needs no token, and a create request names an engine
            and a version rather than an image.
          required: [enabled, engines]
          properties:
            enabled:
              type: boolean
            engines:
              type: array
              items:
                type: object
                required: [engine, version]
                properties:
                  engine:
                    type: string
                    enum: [postgres]
                  version:
                    type: string
                    example: '18'
    SystemCapacity:
      type: object
      description: >-
        Host totals versus what is already allocated. `total` is measured by the
        hypervisor (node vCPUs multiplied by the configured overcommit ratio, node
        memory, and the size of the instances pool); `allocated` is summed from the
        instances table, counting every instance that is not `terminated`. A
        terminate deletes the row, so a terminated instance stops being counted
        as soon as it is gone, and rows left in `terminated` by an earlier
        release hold nothing. The capacity rules are documented in
        `00-architecture.md` §6.
      required: [vcpus, memory_bytes, disk_bytes]
      properties:
        vcpus:
          $ref: '#/components/schemas/CapacityMetric'
        memory_bytes:
          $ref: '#/components/schemas/CapacityMetric'
        disk_bytes:
          $ref: '#/components/schemas/CapacityMetric'
    CapacityMetric:
      type: object
      required: [total, allocated]
      properties:
        total:
          type: integer
          format: int64
        allocated:
          type: integer
          format: int64
    InstanceType:
      type: object
      required: [id, vcpus, memory_mib, description]
      properties:
        id:
          type: string
          description: Type id, e.g. `kumo.small`; immutable.
          example: kumo.small
        vcpus:
          type: integer
          minimum: 1
          maximum: 256
        memory_mib:
          type: integer
          minimum: 256
          maximum: 1048576
        description:
          type: string
          maxLength: 255
    InstanceTypeDetail:
      allOf:
        - $ref: '#/components/schemas/InstanceType'
        - type: object
          required: [used_by]
          properties:
            used_by:
              type: array
              description: Ids of the instances that reference the type; a delete is refused while this is non-empty.
              items:
                type: string
    CreateInstanceTypeRequest:
      type: object
      required: [id, vcpus, memory_mib]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
          example: db.large
        vcpus:
          type: integer
          minimum: 1
          maximum: 256
        memory_mib:
          type: integer
          minimum: 256
          maximum: 1048576
        description:
          type: string
          maxLength: 255
          description: Generated from the size when empty or absent.
    UpdateInstanceTypeRequest:
      type: object
      description: At least one field must be set.
      minProperties: 1
      properties:
        vcpus:
          type: integer
          minimum: 1
          maximum: 256
        memory_mib:
          type: integer
          minimum: 256
          maximum: 1048576
        description:
          type: string
          maxLength: 255
    OrphanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Orphan'
    Orphan:
      type: object
      required: [domain_name, uuid, state, first_seen, last_seen]
      properties:
        domain_name:
          type: string
          description: |
            The libvirt domain name, which for a Kumo domain is the instance id
            it was launched under.
          example: i-0a1b2c3d4e5f60718
        uuid:
          type: string
          description: libvirt's own identifier for the domain.
        state:
          type: string
          description: |
            The domain's runtime state in the instance vocabulary, so the console
            renders it with the indicator it uses elsewhere. A domain in a state
            Kumo does not model carries the hypervisor's own word for it.
          example: running
        first_seen:
          type: string
          format: date-time
          description: |
            When a pass first reported this domain. It is kept across passes, so
            a leftover that has been there for a week reads differently from one
            that appeared during the launch an operator is watching.
        last_seen:
          type: string
          format: date-time
          description: The most recent pass that still found it.
    InstanceTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InstanceType'
    KeyPair:
      type: object
      description: A key pair without its private half.
      required: [id, name, type, fingerprint, public_key, created_at]
      properties:
        id:
          type: string
          example: key-0a1b2c3d4e5f60718
        name:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        type:
          $ref: '#/components/schemas/KeyPairType'
        fingerprint:
          type: string
          description: OpenSSH style SHA256 fingerprint.
        public_key:
          type: string
          description: The `authorized_keys` line.
        created_at:
          type: string
          format: date-time
        tags:
          $ref: '#/components/schemas/TagMap'
    KeyPairType:
      type: string
      enum: [ed25519, rsa]
    KeyPairDetail:
      allOf:
        - $ref: '#/components/schemas/KeyPair'
        - type: object
          required: [used_by]
          properties:
            used_by:
              type: array
              description: Ids of the instances this key was launched with.
              items:
                type: string
                example: i-0a1b2c3d4e5f60718
    CreateKeyPairResponse:
      description: |
        The only response that ever carries `private_key`. It is not persisted
        and not logged; losing it means creating a new key pair.
      allOf:
        - $ref: '#/components/schemas/KeyPair'
        - type: object
          required: [private_key]
          properties:
            private_key:
              type: string
              description: OpenSSH private key in PEM form.
    CreateKeyPairRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        type:
          allOf:
            - $ref: '#/components/schemas/KeyPairType'
          default: ed25519
        tags:
          $ref: '#/components/schemas/TagMap'
    ImportKeyPairRequest:
      type: object
      required: [name, public_key]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        public_key:
          type: string
          description: A single OpenSSH `authorized_keys` line.
        tags:
          $ref: '#/components/schemas/TagMap'
    KeyPairList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/KeyPair'
    Image:
      type: object
      required: [id, name, state, kind, created_at, updated_at]
      properties:
        id:
          type: string
          example: img-0a1b2c3d4e5f60718
        name:
          type: string
        description:
          type: string
        state:
          $ref: '#/components/schemas/ImageState'
        state_reason:
          type: string
          nullable: true
          description: Why the image failed or is waiting.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Download progress, only present while it is known.
        format:
          type: string
          enum: [qcow2, raw]
        architecture:
          type: string
          enum: [x86_64, aarch64]
        os_family:
          type: string
          description: e.g. `ubuntu`, `debian`, `rocky`.
        os_version:
          type: string
        default_user:
          type: string
          description: Login name injected into the image.
        kind:
          type: string
          enum: [user, engine]
          description: >-
            `user` is an ordinary image, listed by `GET /images`. `engine` is a
            golden image with a database engine installed, which a DB instance
            boots from and which `GET /images` never returns
            (07-databases.md section 3).
        engine:
          type: string
          enum: [postgres, kubernetes]
          nullable: true
          description: >-
            Set on an engine image, null on any other. `postgres` is a database
            engine (07-databases.md); `kubernetes` is the node image of the
            Kubernetes module (08-kubernetes.md) and is never offered as a
            database.
        engine_version:
          type: string
          example: '18'
          nullable: true
          description: >-
            The version the engine is identified by: Postgres' major (`18`),
            Kubernetes' minor (`1.37`). Set on an engine image, null on any
            other.
        source_url:
          type: string
          format: uri
          nullable: true
        checksum:
          description: The expected checksum, when the source publishes one.
          allOf:
            - $ref: '#/components/schemas/Checksum'
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
          description: Size on disk once known.
        min_disk_gb:
          type: integer
          description: Smallest root disk this image boots from.
        task_id:
          type: string
          nullable: true
          description: |
            The task of the most recent import or delete. Carried by the `202`
            import and delete responses so the console can follow the work
            without a second request.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          $ref: '#/components/schemas/TagMap'
    ImageState:
      type: string
      description: '`pending` → `downloading` → `available`, plus `failed` and `deleting`.'
      enum: [pending, downloading, available, failed, deleting]
    Checksum:
      type: object
      required: [algorithm, value]
      properties:
        algorithm:
          type: string
          enum: [sha256, sha512]
        value:
          type: string
    ImportImageRequest:
      type: object
      required: [name, source_url]
      properties:
        name:
          type: string
        description:
          type: string
        source_url:
          type: string
          format: uri
          description: '`http` or `https`; link-local and metadata ranges are refused.'
        checksum:
          $ref: '#/components/schemas/Checksum'
        os_family:
          type: string
          default: linux
        os_version:
          type: string
        architecture:
          type: string
          enum: [x86_64, aarch64]
          default: x86_64
        default_user:
          type: string
        min_disk_gb:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [user, engine]
          description: >-
            Omit it to import an ordinary image, which is how it defaults.
            `engine` imports a golden image for the databases or the
            Kubernetes module and requires `engine` and `engine_version`;
            both are refused without it.
        engine:
          type: string
          enum: [postgres, kubernetes]
          description: 'Required with `kind: engine`, refused otherwise.'
        engine_version:
          type: string
          pattern: '^([0-9]{1,3}|1\.[0-9]{1,3})$'
          example: '18'
          description: >-
            Required with `kind: engine`, refused otherwise. One precision per
            engine, so two spellings cannot name the same one: Postgres by its
            major, 1-3 digits (`18`, never `18.6`); Kubernetes by its minor
            (`1.37`, never `1.37.2`).
        tags:
          $ref: '#/components/schemas/TagMap'
    UpdateImageRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          $ref: '#/components/schemas/TagMap'
    CatalogImage:
      type: object
      description: A well-known cloud image offered by the quick import picker.
      required: [id, name, source_url]
      properties:
        id:
          type: string
          example: ubuntu-24.04
        name:
          type: string
        description:
          type: string
        os_family:
          type: string
          enum: [ubuntu, debian, rocky, almalinux, fedora, alpine]
        os_version:
          type: string
        architecture:
          type: string
          enum: [x86_64, aarch64]
        default_user:
          type: string
        min_disk_gb:
          type: integer
        source_url:
          type: string
          format: uri
        checksum_url:
          type: string
          format: uri
    ImageList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Image'
    Instance:
      type: object
      description: >-
        An instance on this node. A terminate removes it, so an id that has been
        terminated reads as `404` rather than as a row in `terminated`.
      required:
        - id
        - name
        - state
        - image_id
        - instance_type
        - vcpus
        - memory_mib
        - root_disk_gb
        - launched_at
      properties:
        id:
          type: string
          example: i-0a1b2c3d4e5f60718
        name:
          type: string
        state:
          $ref: '#/components/schemas/InstanceState'
        state_reason:
          type: string
          nullable: true
        image_id:
          type: string
        image_name:
          type: string
          description: Denormalised for list views.
        instance_type:
          type: string
          example: kumo.small
        vcpus:
          type: integer
        memory_mib:
          type: integer
        root_disk_gb:
          type: integer
        key_pair_id:
          type: string
          nullable: true
        key_pair_name:
          type: string
          nullable: true
          description: Kept for display after the key was deleted.
        private_ip:
          type: string
          nullable: true
        mac_address:
          type: string
          nullable: true
        vpc_id:
          type: string
          nullable: true
          description: The VPC of the instance, read from its network interface. Null when the instance has no interface.
        subnet_id:
          type: string
          nullable: true
          description: The subnet the instance's interface belongs to. Null when the instance has no interface.
        network_interfaces:
          type: array
          description: The live interfaces of the instance. A terminate deletes them with the row.
          items:
            $ref: '#/components/schemas/NetworkInterface'
        user_data:
          type: string
          nullable: true
          description: Only present for administrators; never returned by list.
        task_id:
          type: string
          nullable: true
          description: The task of the most recent state change.
        launched_at:
          type: string
          format: date-time
        terminated_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Set only on a row an earlier release kept as history. A terminate
            deletes the row rather than writing it.
        updated_at:
          type: string
          format: date-time
        tags:
          $ref: '#/components/schemas/TagMap'
    NetworkInterface:
      type: object
      required:
        - id
        - device_index
        - mac_address
        - private_ip
        - subnet_id
        - vpc_id
      properties:
        id:
          type: string
          example: eni-0a1b2c3d4e5f60718
        device_index:
          type: integer
          description: 0 is eth0; multi-NIC instances will carry higher indexes.
        mac_address:
          type: string
          example: 52:54:00:0a:0b:0c
        private_ip:
          type: string
          description: The address the launch allocated, served by dnsmasq.
        subnet_id:
          type: string
        vpc_id:
          type: string
    InstanceState:
      type: string
      description: >-
        `terminated` is only ever seen on a row an earlier release kept as
        history: a terminate deletes the row, and `DELETE` purges such a row when
        it is asked for.
      enum: [pending, running, stopping, stopped, terminating, terminated, error]
    LaunchInstanceRequest:
      type: object
      required: [name, image_id, instance_type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        image_id:
          type: string
        instance_type:
          type: string
          example: kumo.small
        key_pair_id:
          type: string
          description: Injects the public key into the guest.
        subnet_id:
          type: string
          description: |
            Attaches the instance to one subnet. Omitted, it attaches to the
            default subnet of the default VPC.
        root_disk_gb:
          type: integer
          minimum: 1
          maximum: 2048
          description: Defaults to the image's `min_disk_gb`.
        user_data:
          type: string
          description: Cloud-init payload, at most 16 KiB. Never logged.
        count:
          type: integer
          minimum: 1
          maximum: 1
          default: 1
          description: |
            Must be 1. The field is part of the contract for a release that can
            launch several instances from one image, and is refused until then
            with a `400` naming `count`.
        tags:
          $ref: '#/components/schemas/TagMap'
    UpdateInstanceRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        tags:
          $ref: '#/components/schemas/TagMap'
    InstanceList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Instance'
    DBInstance:
      type: object
      description: >-
        A managed Postgres server. It never carries the admin password, the
        SCRAM verifier or its salt, because none of them is stored (R8).
      required:
        - id
        - identifier
        - state
        - engine
        - engine_version
        - image_id
        - instance_id
        - instance_type
        - storage_gb
        - port
        - admin_username
        - database_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: db-0a1b2c3d4e5f60718
        identifier:
          type: string
          description: >-
            The user-chosen name. It is immutable, because it is the DNS label
            the endpoint resolves under.
          example: orders
        state:
          $ref: '#/components/schemas/DBInstanceState'
        state_reason:
          type: string
          nullable: true
          description: >-
            Why a DB instance is `failed`. The prefixes are tokens an operator
            can grep for: `engine_not_responding:` and `server_failed:`.
        engine:
          $ref: '#/components/schemas/DBEngine'
        engine_version:
          type: string
          example: '18'
        image_id:
          type: string
          description: The engine image the server booted from.
        instance_id:
          type: string
          description: >-
            The server behind this DB instance. It is not on the Instances
            pages and its lifecycle endpoints answer 409, but the id is
            returned: the console log and the orphan report are keyed by it,
            and hiding it would make the module harder to support without
            making it safer.
          example: i-0a1b2c3d4e5f60718
        instance_type:
          type: string
          example: kumo.medium
        vcpus:
          type: integer
          description: Read from the server, which is where the compute shape lives.
        memory_mib:
          type: integer
        storage_gb:
          type: integer
          description: The data disk, not the root disk.
        port:
          type: integer
          example: 5432
        admin_username:
          type: string
        database_name:
          type: string
        endpoint:
          type: string
          nullable: true
          description: >-
            `<identifier>.<vpc name>`, resolvable inside the VPC and nowhere
            else. Null until the guest has an address.
          example: orders.default
        task_id:
          type: string
          nullable: true
          description: The task of the most recent state change.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DBInstanceState:
      type: string
      description: >-
        The database's state, not the server's: a guest that is running while
        the engine inside it has never answered is `creating` or `failed`,
        never `available`.
      enum: [creating, available, starting, stopping, stopped, rebooting, deleting, failed]
    DBEngine:
      type: string
      description: One engine in this version, as a column rather than an assumption.
      enum: [postgres]
    CreateDBInstanceRequest:
      type: object
      required: [identifier, instance_type, admin_username, admin_password, database_name]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 60
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
        engine:
          $ref: '#/components/schemas/DBEngine'
        engine_version:
          type: string
          pattern: '^[0-9]{1,3}$'
          description: Omitted, the newest available version is used.
          example: '18'
        instance_type:
          type: string
          example: kumo.medium
        storage_gb:
          type: integer
          minimum: 5
          maximum: 2048
          description: >-
            The data disk, and at least the engine image's `min_disk_gb`.
            Defaults to the floor.
        subnet_id:
          type: string
          description: >-
            Attaches the server to one subnet. Omitted, it attaches to the
            default subnet of the default VPC.
        admin_username:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z_][a-z0-9_]*$'
          description: >-
            The role first boot creates, owning `database_name`. Reserved
            names are refused.
          example: app
        admin_password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          description: >-
            Printable ASCII only. A SCRAM-SHA-256 verifier is derived from it
            and the password is discarded: it is never stored, logged or put
            in a task payload, and there is no way to read it back or reset it
            (R8). The ASCII rule is a correctness rule, not a convenience --
            SCRAM normalises a password with SASLprep before deriving and Kumo
            does not, so anything else would authenticate nowhere.
        database_name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z_][a-z0-9_]*$'
          example: orders
    DBInstanceList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DBInstance'
    ConsoleOutput:
      type: object
      required: [instance_id, output]
      properties:
        instance_id:
          type: string
        output:
          type: string
          description: The tail of the serial console log.
    Task:
      type: object
      required: [id, type, state, created_at, updated_at]
      properties:
        id:
          type: string
          example: task-0a1b2c3d4e5f60718
        type:
          type: string
          description: Operation name, e.g. `instance.launch`.
          example: instance.launch
        resource_id:
          type: string
          nullable: true
        state:
          $ref: '#/components/schemas/TaskState'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskState:
      type: string
      enum: [pending, running, succeeded, failed]
    TaskList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Task'
    Page:
      type: object
      description: Shared shape of every list response.
      properties:
        next_page_token:
          type: string
          nullable: true
          description: Absent on the last page.
    BucketState:
      type: string
      enum: [available, deleting]
    Bucket:
      type: object
      required: [name, state, created_at, created_by, tags]
      properties:
        name:
          type: string
        state:
          $ref: '#/components/schemas/BucketState'
        created_at:
          type: string
          format: date-time
          description: When the object storage server created it.
        created_by:
          type: string
          nullable: true
          description: Username of the creator; null for a bucket made outside Kumo.
        tags:
          $ref: '#/components/schemas/TagMap'
    BucketDetail:
      allOf:
        - $ref: '#/components/schemas/Bucket'
        - type: object
          required: [versioning, endpoint, region]
          properties:
            versioning:
              type: string
              enum: [off, enabled, suspended]
            endpoint:
              type: string
              description: The S3 endpoint clients connect to (KUMO_S3_PUBLIC_URL).
            region:
              type: string
    BucketList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bucket'
    CreateBucketRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            3-63 lowercase letters, digits, '.' and '-', starting and ending with
            a letter or digit, no '..', not an IP address, and none of the
            reserved prefixes and suffixes of the S3 naming rules.
          pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
        versioning:
          type: boolean
          default: false
        tags:
          $ref: '#/components/schemas/TagMap'
    UpdateBucketRequest:
      type: object
      minProperties: 1
      properties:
        versioning:
          type: boolean
        tags:
          $ref: '#/components/schemas/TagMap'
    ObjectListing:
      type: object
      required: [prefix, folders, objects, next_cursor]
      properties:
        prefix:
          type: string
        folders:
          type: array
          items:
            type: string
          description: Common prefixes one level below, each ending in '/'.
        objects:
          type: array
          items:
            $ref: '#/components/schemas/StorageObject'
        next_cursor:
          type: string
          nullable: true
    StorageObject:
      type: object
      required: [key, size_bytes, last_modified, etag]
      properties:
        key:
          type: string
        size_bytes:
          type: integer
          format: int64
        last_modified:
          type: string
          format: date-time
        etag:
          type: string
    PresignUploadRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 1024
          description: Full object key; must not start or end with '/'.
        content_type:
          type: string
          default: application/octet-stream
    PresignDownloadRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
    CreateFolderRequest:
      type: object
      required: [prefix]
      properties:
        prefix:
          type: string
    DeleteObjectsRequest:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
    PresignedURL:
      type: object
      required: [url, method, headers, expires_at]
      properties:
        url:
          type: string
        method:
          type: string
          enum: [GET, PUT]
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers the request must carry for the signature to match.
        expires_at:
          type: string
          format: date-time
    AccessLevel:
      type: string
      enum: [read-only, read-write]
      description: >-
        read-only lists the buckets and reads objects; read-write also writes
        and deletes objects. Neither can create, delete or reconfigure a bucket.
    AccessKey:
      type: object
      required: [access_key, name, level, buckets, state, created_by, created_at, updated_at]
      properties:
        access_key:
          type: string
          description: The S3 access key id, KUMO + 16 base32 characters.
        name:
          type: string
        level:
          $ref: '#/components/schemas/AccessLevel'
        buckets:
          type: array
          items:
            type: string
        state:
          type: string
          enum: [active, missing]
          description: missing means the object store no longer has the key; it does not work.
        created_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatedAccessKey:
      allOf:
        - $ref: '#/components/schemas/AccessKey'
        - type: object
          required: [secret_key]
          properties:
            secret_key:
              type: string
              description: Returned only here. Kumo does not store it.
    AccessKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessKey'
    CreateAccessKeyRequest:
      type: object
      required: [name, level, buckets]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
        level:
          $ref: '#/components/schemas/AccessLevel'
        buckets:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
    UpdateAccessKeyRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        level:
          $ref: '#/components/schemas/AccessLevel'
        buckets:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
    BucketDeleted:
      type: object
      required: [bucket, task_id]
      properties:
        bucket:
          $ref: '#/components/schemas/Bucket'
        task_id:
          type: string
    TagMap:
      type: object
      description: Free-form tags.
      additionalProperties:
        type: string
    UpdateTagsRequest:
      type: object
      minProperties: 1
      properties:
        tags:
          $ref: '#/components/schemas/TagMap'
    VPC:
      type: object
      description: One VPC is one libvirt network and one Linux bridge.
      required: [id, name, cidr, mode, gateway_ip, netmask, bridge_name, libvirt_network, is_default, created_at, updated_at]
      properties:
        id:
          type: string
          example: vpc-0a1b2c3d4e5f60718
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          description: Immutable; seeds the DNS domain of the network.
        cidr:
          type: string
          example: 10.0.0.0/16
          description: RFC 1918, /16 to /28. Immutable.
        mode:
          $ref: '#/components/schemas/VPCForwardMode'
        gateway_ip:
          type: string
          description: The first host address of the VPC CIDR.
        netmask:
          type: string
          description: Dotted quad, e.g. `255.255.0.0`.
        bridge_name:
          type: string
          example: kmb0a1b2c3d
          description: The Linux bridge interface, `kmb` plus the first 8 hex of the id.
        libvirt_network:
          type: string
          description: The libvirt network name, usually the id itself.
        is_default:
          type: boolean
          description: True for the one default VPC every launch lands in.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          $ref: '#/components/schemas/TagMap'
    VPCForwardMode:
      type: string
      description: '`nat` reaches the LAN, `isolated` keeps guests on the bridge.'
      enum: [nat, isolated]
    VPCDetail:
      allOf:
        - $ref: '#/components/schemas/VPC'
        - type: object
          required: [subnet_count, instance_count]
          properties:
            subnet_count:
              type: integer
              format: int64
            instance_count:
              type: integer
              format: int64
              description: Instances allocated from this VPC's subnets.
    VPCWithTask:
      description: The `202` answer of a VPC create or delete.
      allOf:
        - $ref: '#/components/schemas/VPC'
        - type: object
          required: [task_id]
          properties:
            task_id:
              type: string
              example: task-0a1b2c3d4e5f60718
    CreateVPCRequest:
      type: object
      required: [name, cidr]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          description: Unique label, seeds the DNS domain.
        cidr:
          type: string
          description: RFC 1918, /16 to /28, no overlap with a VPC or host route.
        mode:
          allOf:
            - $ref: '#/components/schemas/VPCForwardMode'
          default: nat
        tags:
          $ref: '#/components/schemas/TagMap'
    VPCList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VPC'
    Subnet:
      type: object
      description: An allocation partition of its parent VPC's bridge.
      required: [id, vpc_id, name, cidr, total_ips, usable_ips, allocated_ips, is_default, created_at, updated_at]
      properties:
        id:
          type: string
          example: subnet-0a1b2c3d4e5f60718
        vpc_id:
          type: string
          description: The parent VPC, which owns the gateway.
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          description: Unique within the VPC. Immutable.
        cidr:
          type: string
          example: 10.0.1.0/24
          description: Fully contained in the VPC CIDR. Immutable.
        total_ips:
          type: integer
          format: int64
          description: Every address of the CIDR.
        usable_ips:
          type: integer
          format: int64
          description: Minus the network, broadcast and the VPC gateway.
        allocated_ips:
          type: integer
          format: int64
          description: Addresses handed to network interfaces.
        is_default:
          type: boolean
          description: True for the default subnet of the default VPC.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          $ref: '#/components/schemas/TagMap'
    CreateSubnetRequest:
      type: object
      required: [vpc_id, name, cidr]
      properties:
        vpc_id:
          type: string
          pattern: '^vpc-[0-9a-f]{17}$'
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
        cidr:
          type: string
          description: Contained in the VPC, no sibling overlap.
        tags:
          $ref: '#/components/schemas/TagMap'
    SubnetList:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Subnet'
root = "."
tmp_dir = ".tmp"

[build]
  bin = "bin/air/kumod"
  cmd = "CGO_ENABLED=0 go build -o ./bin/air/kumod ./cmd/kumod"
  delay = 500
  exclude_dir = ["web", "bin", "docs", ".git", ".tmp", "internal/store/migrations"]
  exclude_file = ["web/dist/*"]
  include_ext = ["go", "sql", "yaml", "yml"]
  include_dir = ["cmd", "internal"]
  stop_on_error = false

[log]
  time = true

[misc]
  clean_on_exit = true
  send_interrupt = true
  kill_delay = "500ms"